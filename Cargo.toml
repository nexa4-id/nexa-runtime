[package]
name = "nexa-runtime"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Nexa language runtime and native worker foundation"
license = "MIT"

[lib]
name = "nexa_runtime"
path = "src/lib.rs"

[[bin]]
name = "nexa"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
