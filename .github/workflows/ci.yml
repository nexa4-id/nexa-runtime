name: Rust CI

on:
  push:
    branches:
      - rebuild/v0.3
  pull_request:
    branches:
      - rebuild/v0.3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexa-rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format source snapshot
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Upload formatted Rust sources
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nexa-rustfmt-snapshot
          path: |
            src/**/*.rs
            tests/**/*.rs
            examples/**/*.rs
          if-no-files-found: error
          retention-days: 1

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
